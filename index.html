<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tres Reinas Logística</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
--dark:#0a0a0f;
--gold:#D4AF37;
--text:#ffffff;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
font-family: 'Montserrat', sans-serif;
background:var(--dark);
color:var(--text);
}

/* NAV */
nav{
position:fixed;
top:20px;
right:40px;
z-index:1000;
display:flex;
gap:15px;
}

nav a{
background:white;
color:black;
padding:10px 22px;
border-radius:30px;
text-decoration:none;
font-weight:600;
transition:0.3s;
}

nav a:hover{
background:var(--gold);
color:white;
}

/* HERO */
.hero{
height:100vh;
background:url('assets/ss.png') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
animation:fadeIn 1.5s ease;
}

/* SECTIONS */
section{
padding:100px 10%;
text-align:center;
animation:fadeUp 1.5s ease;
}

h2{
font-family:'Playfair Display';
font-size:40px;
color:var(--gold);
margin-bottom:30px;
}

/* FLOTA */
.fleet-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
margin-top:50px;
}

.fleet-grid img{
width:100%;
border-radius:12px;
transition:0.4s;
}

.fleet-grid img:hover{
transform:scale(1.05);
}

/* FORM */
form{
max-width:600px;
margin:auto;
display:flex;
flex-direction:column;
gap:15px;
}

input, textarea{
padding:12px;
border-radius:8px;
border:none;
}

button{
background:var(--gold);
color:white;
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

button:hover{
background:#b8922a;
}

/* ANIMATIONS */
@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

@keyframes fadeUp{
from{opacity:0; transform:translateY(40px)}
to{opacity:1; transform:translateY(0)}
}
</style>
</head>

<body>

<nav>
<a href="#flota">Flotilla</a>
<a href="#cotizacion">Cotización</a>
<a href="tel:+528129460629">Llamar</a>
</nav>

<!-- HERO CON TU IMAGEN PRINCIPAL -->
<div class="hero"></div>

<!-- FLOTILLA -->
<section id="flota">
<h2>Nuestra Flotilla</h2>
<div class="fleet-grid">
<img src="assets/2.png" alt="">
<img src="assets/3.png" alt="">
<img src="assets/4.png" alt="">
<img src="assets/5.png" alt="">
<img src="assets/6.png" alt="">
<img src="assets/7.png" alt="">
</div>
</section>

<!-- COTIZACIÓN -->
<section id="cotizacion">
<h2>Solicita una Cotización</h2>

<form>
<input type="text" placeholder="Nombre" required>
<input type="email" placeholder="Correo" required>
<input type="text" placeholder="Teléfono">
<textarea rows="5" placeholder="Detalles del servicio"></textarea>
<button type="submit">Enviar Cotización</button>
</form>

</section>

</body>
</html>
